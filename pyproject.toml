[project]
name = "castletool-android"
version = "0.6.0"
description = "Castletool for Android: browse, edit and save Castle decks via the Castle API"
readme = "README.md"
requires-python = ">=3.13"          # Flet bundles the highest supported Python that satisfies this (3.14)
dependencies = [
  "flet==1.0.4",
  "requests",
  "mido",
  "fonttools",
  # Binary packages: pin to the exact versions Flet builds for Android (pypi.flet.dev)
  "pillow==12.2.0",
  "numpy==2.4.6",
  "av==18.1.0",                     # video + audio decoding/encoding (replaces the ffmpeg binary)
]

[dependency-groups]
dev = [
  "sounddevice",                    # live music on your PC while developing
  "scipy",                          # tests only
]

[tool.flet]
product = "Castletool"
org = "com.mgooseplayz"

[tool.flet.app]
path = "src"                        # main.py, assets/ and player/ live here

[tool.flet.android]
target_arch = ["arm64-v8a"]         # phones; drops the x86/32-bit builds (smaller APK, faster build)
dependencies = ["pyjnius==1.7.0"]   # live music output through Android's AudioTrack

# Live music output when you build a desktop version
[tool.flet.windows]
dependencies = ["sounddevice"]
[tool.flet.macos]
dependencies = ["sounddevice"]
[tool.flet.linux]
dependencies = ["sounddevice"]
