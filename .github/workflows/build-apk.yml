name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python tests/run_all.py

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Diagnose Flet CLI
        run: |
          uv python install 3.13
          uv sync --python 3.13
          uv run python --version
          uv run flet --version
          uv run flet --version --json

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error