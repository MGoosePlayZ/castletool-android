name: Build Castletool Android

on:
  workflow_dispatch:
    push:
      branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
    
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}
    
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: castletool-android-apk
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 14